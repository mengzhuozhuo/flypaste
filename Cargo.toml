[workspace]
resolver = "2"
members = [
    "crates/flypaste",
    "crates/clipboard",
    "crates/history",
    "crates/hotkey",
    "crates/injector",
    "crates/settings",
]

[workspace.package]
publish = false
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]

# UI 框架 - GPUI from Zed
gpui = { git = "https://github.com/zed-industries/zed.git", package = "gpui", rev = "ee6495dce4012019ccc235486afa800da443d680" }
gpui_macos = { git = "https://github.com/zed-industries/zed.git", package = "gpui_macos", rev = "ee6495dce4012019ccc235486afa800da443d680", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", package = "gpui_platform", rev = "ee6495dce4012019ccc235486afa800da443d680" }

# Zed 内部依赖
collections = { git = "https://github.com/zed-industries/zed.git", package = "collections", rev = "ee6495dce4012019ccc235486afa800da443d680" }
util = { git = "https://github.com/zed-industries/zed.git", package = "util", rev = "ee6495dce4012019ccc235486afa800da443d680" }
async-task = "4.7"
block = "0.1"
core-text = "21"
core-foundation-sys = "0.8.6"
core-video = "0.5.2"
ctor = "0.4.0"
derive_more = { version = "2.1.1", features = ["add", "add_assign", "deref", "deref_mut", "display", "from_str", "mul", "mul_assign", "not"] }
dispatch2 = "0.3.1"
etagere = "0.2"
foreign-types = "0.5"
image = "0.25.1"
itertools = "0.14.0"
libc = "0.2"
mach2 = "0.5"
media = "0.1.0"
metal = "0.33"
parking_lot = "0.12.1"
pathfinder_geometry = "0.5"
raw-window-handle = "0.6"
semver = "1.0"
smallvec = "1.6"
strum = "0.27.2"
uuid = "1.1.2"

# 异步
tokio = { version = "1" }



# macOS 原生接口
cocoa = "=0.26.0"
cocoa-foundation = "=0.2.0"
core-foundation = "=0.10.0"
core-graphics = "0.24"
objc = "0.2"

# 粘贴板
arboard = "3.4"

# 全局快捷键
global-hotkey = "0.6.1"

# 设置管理
serde = { version = "1.0.221", features = ["derive"] }
serde_json = "1.0.144"

# 其他
anyhow = "1.0.86"
log = "0.4"
env_logger = "0.11"
crossbeam-channel = "0.5"
